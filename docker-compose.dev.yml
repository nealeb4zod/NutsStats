version: '3.9'

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"YourStrong!Passw0rd\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/NutsStats.Api/Dockerfile
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sql;Database=NutsStats;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=true;"
    ports:
      - "5000:8080"

  scraper:
    build:
      context: .
      dockerfile: src/NutsStats.Scraper/Dockerfile
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sql;Database=NutsStats;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=true;"
